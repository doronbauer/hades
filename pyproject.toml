[project]
name = "hades"
version = "0.1.0"
description = "Local music-library indexer with independent BPM, key and loudness analysis"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "tinytag==2.3.2",
    "essentia==2.1b6.dev1389",
]

[project.scripts]
hades = "hades.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hades"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "ffmpeg: needs the ffmpeg binary to create tagged fixtures in non-WAV formats",
    "essentia: runs real Essentia audio analysis",
]
